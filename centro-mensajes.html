<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centro de comunicaciones · Amor y Libertad</title><link rel="icon" href="Img/logo.png"><link rel="stylesheet" href="css/messages.css"><link rel="stylesheet" href="css/messages-extra.css"><link rel="stylesheet" href="css/messages-roles.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head>
<body><div class="msg-shell"><header class="msg-top"><a data-role-home href="dashboard-superadmin.html">← Volver a mi panel</a><div class="msg-brand-title"><img src="Img/logo.png" alt="Logo del colegio"><div><h1>Centro de comunicaciones</h1><p>Avisos institucionales con destinatarios, prioridad y confirmación de lectura.</p></div></div><div class="msg-user"><strong id="msg-user-name">Cargando…</strong><span id="msg-user-role"></span></div></header>
<main class="msg-main"><section class="msg-compose"><div class="msg-heading"><div><span class="msg-kicker">Nuevo mensaje</span><h2>Crear comunicación</h2></div><span class="msg-security">Distribución por permisos</span></div><form id="message-form" class="msg-form">
<label>Asunto <small>(opcional)</small><input id="msg-title" maxlength="120" placeholder="Ej. Aviso importante"></label><label>Destinatarios<select id="msg-target-type" required><option value="usuario">Una persona específica</option><option value="roles">Seleccionar roles</option><option value="colegio">Todo el colegio</option><option value="docentes">Todos los docentes</option><option value="direccion">Todo el equipo directivo</option><option value="grupo">Un grupo</option><option value="nivel">Un nivel</option><option value="alumno">Un estudiante / tutor</option></select></label>
<label id="msg-target-wrap" class="wide">Buscar destinatario<input id="msg-target-search" autocomplete="off" placeholder="Escribe el nombre, usuario o correo"><input id="msg-target-id" type="hidden"><div id="role-targets" class="role-targets"><label><input type="checkbox" value="maestro"> Docentes</label><label><input type="checkbox" value="padre"> Padres / tutores</label></div><div id="contact-results" class="contact-results"></div><span id="selected-target" class="selected-target">Cargando directorio…</span></label>
<label>Prioridad<select id="msg-priority"><option value="normal">Normal</option><option value="importante">Importante</option><option value="urgente">Urgente</option></select></label><label class="wide">Mensaje<textarea id="msg-body" maxlength="2500" required></textarea></label><label class="wide file-field">Adjunto opcional · imagen, PDF, DOCX o XLSX · máximo 10 MB<input type="file" id="msg-file" accept="image/*,.pdf,.docx,.xlsx"></label><div class="wide msg-actions"><button type="submit">Publicar mensaje</button><span id="upload-state"></span></div></form></section>
<section class="msg-inbox"><div class="msg-heading"><div><span class="msg-kicker">Bandeja institucional</span><h2>Mensajes recientes</h2></div><button id="refresh-messages" class="ghost">Actualizar</button></div><div class="msg-filters"><button class="active" data-filter="received">Recibidos</button><button data-filter="sent">Enviados por mí</button><button data-filter="all">Todos visibles</button></div><div id="message-list" class="message-list"><div class="msg-empty">Cargando mensajes…</div></div></section></main></div><script type="module" src="js/messages.js"></script><script type="module" src="js/role-nav.js"></script></body></html>
